services:
  postgres:
    image: postgres:16-alpine
    container_name: screener-postgres
    # Come back with Docker. Twice (2026-09-18, 2026-09-19) the VM stopped under
    # this container -- Windows sleep or a Docker Desktop restart -- and with the
    # default policy of "no" it stayed down until someone noticed a hung command.
    restart: unless-stopped
    environment:
      POSTGRES_USER: screener
      POSTGRES_PASSWORD: screener
      POSTGRES_DB: screener
    ports:
      - "5432:5432"
    volumes:
      - screener-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screener -d screener"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  screener-pgdata:
